services:
  # ============================================================================
  # 1. Redis Cache Service
  # ============================================================================
  redis:
    image: redis:8-alpine
    container_name: rasid-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      # Expose only to local loopback (127.0.0.1) for local inspection, protecting Redis from public exposure
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - rasid-network

  # ============================================================================
  # 2. Rasid Express Backend Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rasid-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rasid-network

# ==============================================================================
# Persistent Named Volumes & Network Configuration
# ==============================================================================
volumes:
  redis_data:
    name: rasid_redis_data

networks:
  rasid-network:
    name: rasid_network
    driver: bridge
